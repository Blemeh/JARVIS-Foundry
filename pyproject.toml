[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundry"
version = "0.1.0"
description = "Durable autonomy kernel and independent supervisor for JARVIS Foundry"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
jarvis = "jarvis_foundry.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/foundry"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", ".venv", "docs/remaster/evidence"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.13"
show_error_codes = true
warn_unused_configs = true
exclude = ["docs/", ".git/", "var/"]
mypy_path = ["src", "scripts/remaster/r3"]

[tool.coverage.run]
branch = true
source = ["src/jarvis_foundry"]
concurrency = ["thread"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".git", ".venv", "var", "docs", "__pycache__"]

