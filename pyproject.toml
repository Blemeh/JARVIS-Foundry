[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundry"
version = "0.1.0"
description = "Durable autonomy kernel and independent supervisor for JARVIS Foundry"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26,<5",
    "mcp>=2.1,<3",
    "pyyaml>=6.0",
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "reportlab>=4.4,<5",
    "uiautomation==2.0.29; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
web = [
    "playwright==1.62.0",
    "trafilatura==2.2.0",
]
voice = [
    "edge-tts>=7.0",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis_foundry.cli.main:main"
jarvis-adapter-factory = "jarvis_foundry.adapter_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_foundry = ["assets/*", "assets/packaging/*"]

[tool.pytest.ini_options]
# FAST = default development suite. FULL is never this default.
# FAST: pytest tests/foundry
# FULL: pytest tests/foundry tests/convergence
testpaths = ["tests/foundry"]
addopts = "-q"

[tool.jarvis.tests]
fast = ["tests/foundry"]
full = ["tests/foundry", "tests/convergence"]

