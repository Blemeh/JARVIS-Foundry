[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundry"
version = "0.1.0"
description = "Durable autonomy kernel and independent supervisor for JARVIS Foundry"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
jarvis = "jarvis_foundry.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# FAST = default development suite. FULL is never this default.
# FAST: pytest tests/foundry
# FULL: pytest tests/foundry tests/convergence
testpaths = ["tests/foundry"]
addopts = "-q"

[tool.jarvis.tests]
fast = ["tests/foundry"]
full = ["tests/foundry", "tests/convergence"]

