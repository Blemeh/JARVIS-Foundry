[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundry"
version = "0.1.0"
description = "Durable autonomy kernel and independent supervisor for JARVIS Foundry"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
    "pypdf==6.10.0",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
web = [
    "playwright==1.62.0",
    "trafilatura==2.2.0",
]

[project.scripts]
jarvis = "jarvis_foundry.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_foundry = ["assets/*"]

[tool.pytest.ini_options]
# FAST = default development suite. FULL is never this default.
# FAST: pytest tests/foundry
# FULL: pytest tests/foundry tests/convergence
testpaths = ["tests/foundry"]
addopts = "-q"

[tool.jarvis.tests]
fast = ["tests/foundry"]
full = ["tests/foundry", "tests/convergence"]

