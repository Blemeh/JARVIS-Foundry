[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-foundry"
version = "0.1.0"
description = "Durable autonomy kernel and independent supervisor for JARVIS Foundry"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
jarvis = "jarvis_foundry.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/foundry"]
addopts = "-q"

