schema_version: 1
work_package_id: "WP5"
status: "PENDING_ACTIVATION"
package_state: "INACTIVE"
gate_verdict: "NOT_TESTED"
later_packages: "INACTIVE_NOT_TESTED"
objective: "Complete the mission and verification loop gate: next-action proposal validation, step dispatch, result intake, independent verification, repair, rejection, blocking, and local commit after PASS."
expected_value: "The Supervisor runs a mission end-to-end without owner prompting: propose the next action from durable mission state, dispatch it through the WP4 role adapter, intake the structured result, verify it independently (provider-diverse when available), repair a deliberately failed step, and commit locally only after a verified PASS."
target_resources:
  - "JARVIS-Foundry"
  - ".h (isolated Hermes development checkout, read-only; real dispatch disabled by default)"
capabilities_required:
  - "local_read"
  - "local_project_write"
  - "sqlite_wal"
  - "subprocess"
  - "role_dispatch (WP4)"
active_owner_vetoes_checked: []
expected_effects:
  - "next-action proposal validated deterministically against mission state and envelope contract"
  - "step dispatch through RoleDispatcher with durable agent_run events (WP4)"
  - "result intake: structured RoleResult -> agent_runs + verification_verdicts"
  - "independent verification: verifier role, verdict recorded with independence metadata"
  - "repair loop: FAIL -> repair role -> re-verify, bounded by a repair cap"
  - "rejection/blocking: BLOCKED outcome precise and durable; honest waiting when no useful action exists"
  - "local git commit after PASS only (never before verification)"
risk_class: "C1"
budget_estimate: 0
acceptance_criteria:
  - "A fake mission with a deliberately failing builder step is repaired and continues to the next useful action without owner prompting (gate)."
  - "Next-action proposal is validated deterministically (unknown mission/step/capability/rollback rejected before dispatch)."
  - "Every dispatch produces durable agent_run events; the loop consumes structured RoleResults from the ledger."
  - "Verifier verdicts are recorded with independence metadata (provider identity, builder vs verifier run ids, same-provider limitation recorded when not diverse)."
  - "FAIL verdict triggers a bounded repair attempt; repair cap exhaustion produces a precise BLOCKED outcome, never an infinite loop."
  - "Local commit happens only after a verified PASS; nothing is committed after FAIL, BLOCKED, or NOT_TESTED."
  - "The loop never touches live Hermes; real dispatch stays disabled by default (WP4 boundary carried forward)."
tests_required:
  - "tests/foundry/test_mission_loop.py"
  - "tests/foundry/test_verification_loop.py"
evidence_required:
  - "docs/evidence/WP5_MISSION_LOOP.md"
rollback_or_compensation: "Project-local staging only; the loop commits only in a registered staging worktree copy, never canonical DBs; a failed verification leaves the worktree unchanged (repair is the only mutation path, bounded)."
stop_conditions:
  - "active owner STOP"
  - "secret exposure"
  - "unexpected live-system mutation (live Hermes, canonical DBs)"
  - "repair loop exceeding the cap without owner direction (records BLOCKED, waits honestly)"
builder: "JARVIS executive (autonomous continuation run)"
independent_verifier: "fresh isolated session; provider-diverse when available, otherwise same-provider with recorded limitation"
next_package_on_pass: "WP6"
