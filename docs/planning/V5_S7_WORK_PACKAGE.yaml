objective: >
  Make the V5 substrate usable by JARVIS's autonomous mission loop
  without bypassing deterministic control: wire only gate-passed
  registry/policy/capability/identity/reconciliation services into
  action selection; expose capability readiness and policy outcomes to
  the executive as facts (never overridable permissions); route
  eligible local and verified online work through ActionEnvelope;
  isolate connector outages and continue unrelated safe missions;
  record predictions, costs, actual effects, verification, and
  outcomes; transparent JARVIS identity for representational actions;
  no external or financial action unless the full capability,
  consequence, provider-evidence, and owner-control path is READY.
