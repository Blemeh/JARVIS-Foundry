work_package: V5_MULTI_SYSTEM_INTELLIGENCE
slice: "3 — Scoped capability and credential broker"
status: ACTIVE
activated_by: "V5-S2 CLOSED PASS (verification.passed:verdict-v5-s2-broker:round1, seq 22385)"
date: 2026-08-13
objective: >
  Give workers narrow, expiring authority without exposing reusable
  secrets: short-lived capabilities bound to mission, agent run,
  target, action, and expiry; immediate revocation on STOP/veto;
  provider authentication resolved at execution time and NEVER copied
  into prompts, mission records, logs, evidence, or notes; redaction of
  secret-like material from stdout, errors, artifacts, and summaries;
  secret IDENTIFIER and outcome recorded without secret VALUES;
  prevention of worker forwarding or persistence of credentials;
  honest NOT_READY/BLOCKED when no real credential or interface exists.
authoritative_requirements:
  - "02_ARCHITECTURE_CONTRACT.md §8 (credential and capability broker: no plaintext in prompts/mission records; narrowest short-lived capability; bound to mission/agent run/target/expiry; redaction; identifier-not-value records; no forwarding/persistence; denied after STOP/veto)"
  - "V5_MASTER_PROMPT.md §6 V5-S3 (gate probes: expiry, replay, scope escalation, STOP revocation, redaction, prompt/log/ledger scans, unavailable-provider handling)"
  - "R-SEC-02 (workers do not receive unnecessary raw secrets), R-AUT-04, RK-08 (secrets leak through prompts or logs)"
dependencies:
  - "V5-S1 systems registry (credential systems registered with honest capability states)"
  - "V5-S2 broker (capability issuance is broker step 9; S3 wires the real issuance)"
in_scope (draft):
  - "src/jarvis_foundry/control/capabilities.py (new): Capability dataclass (capability_id, mission_id, agent_run_id, target, action, scopes, expires_at), issue_capability (deterministic, bound, short-lived), revoke_capability (immediate on STOP/veto), capability state machine (ISSUED -> USED/EXPIRED/REVOKED)"
  - "S2 carried findings: F1 — broker veto-target grammar: bare system id must match (add bare id to _matching_veto identities + regression for both spellings); F2 — non-finite budget-estimate guard (math.isfinite -> NOT_READY) + regression"
