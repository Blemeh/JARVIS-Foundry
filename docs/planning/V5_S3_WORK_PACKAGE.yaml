  - "provider authentication: resolution-at-execution contract — the broker stores NO plaintext; a registered credentials system declares readiness honestly; real provider auth is S8 (no credentials exist on this host — honest NOT_READY/BLOCKED)"
  - "tests/foundry/test_capability_broker.py: expiry (past/now/future), replay (same capability twice), scope escalation (capability used outside its bound action/target refused), STOP revocation (marker/directive/FROZEN revoke immediately), redaction matrix + prompt/log/ledger scans, unavailable provider -> NOT_READY, worker persistence/forwarding refused"
