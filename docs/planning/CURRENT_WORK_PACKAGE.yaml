work_package_id: "WP10"
name: "V3 DISCOVERY AND BUILDING — slice-1: candidate pipeline"
status: "ACTIVE"
package_state: "ACTIVE"
objective: >
  Continuous discovery loop: monitor/observe sources produce CANDIDATES
  with evidence; duplicate detection (canonicalized objective hash vs
  existing candidates plus missions); calibrated deterministic scoring
  (registry-driven weights: strategic fit, value, information gain,
  urgency, confidence, effort, cost, risk, reversibility, opportunity
  cost); approved candidates become MISSIONS (mission.created with the
  candidate as source); outcome tracking (predictions vs reality after
  mission completion).
bounded_deliverables:
  - "schema v10: candidates + candidate_scores"
  - "events: discovery.candidate_generated, discovery.candidate_scored, discovery.candidate_approved (creates mission), discovery.candidate_rejected"
  - "module: discovery_candidates.py (deterministic dedup + scoring)"
  - "tests: test_discovery_candidates.py (8 tests, TDD)"
entry_criteria: "WP9 (V2) gate PASS (independent review)"
exit_criteria: >
  candidate pipeline verified: generation to dedup to scoring to mission
  creation with evidence; outcome tracking wired to mission.completed;
  independent verifier PASS; full suite green.
gate_verdict: "NOT_TESTED"
dependencies: ["WP9 knowledge brain (claims/manifests feed candidates)"]
integration_points:
  - "knowledge_claims: candidate statements recorded as claims (provenance)"
  - "missions: mission.created carries candidate_id"
  - "manifest: candidate context via build_context_manifest"
  - "ledger: all pipeline events append-only, F9 rollback discipline"
design_ref: "temp/V3_SLICE1_DESIGN.md (repo copy after activation)"
