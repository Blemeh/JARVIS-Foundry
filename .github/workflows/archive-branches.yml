name: archive-branches
# One-shot: keep every old Foundry branch as a tag archive/branches/<name>,
# verify each tag points at the branch tip, then delete the branch.
# Nothing is lost: every commit stays reachable from its tag.
on:
  push:
    branches: [claude/hopeful-euler-lv46qf]
    paths: [.github/workflows/archive-branches.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag, verify, delete
        run: |
          git fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          keep=" main claude/hopeful-euler-lv46qf "
          branches=$(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -vx HEAD)
          for b in $branches; do
            case "$keep" in *" $b "*) continue ;; esac
            sha=$(git rev-parse "refs/remotes/origin/$b")
            tag="refs/tags/archive/branches/$b"
            existing=$(git ls-remote origin "$tag" | cut -f1)
            if [ -z "$existing" ]; then git push -q origin "$sha:$tag"; fi
            got=$(git ls-remote origin "$tag" | cut -f1)
            if [ "$got" != "$sha" ]; then echo "tag mismatch for $b: $got != $sha"; exit 1; fi
            git push -q origin --delete "refs/heads/$b"
            echo "archived $b -> archive/branches/$b ($sha)"
          done
          echo "branches left:"; git ls-remote --heads origin | cut -f2
