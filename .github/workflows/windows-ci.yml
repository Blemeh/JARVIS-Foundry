name: windows-ci

on:
  push:
    branches:
      - remaster/post-v7-purpose
  pull_request:

permissions:
  contents: read

jobs:
  r3-quality:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create isolated venv from lock
        shell: powershell
        run: |
          $HostPython = (Get-Command python).Source
          ./scripts/remaster/r3/make_venv.ps1 `
            -VenvPath "$env:TEMP\jarvis-r3-ci-venv" `
            -HostPython $HostPython

      - name: Ruff owned files
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/external_gates.py --mode ruff-owned

      - name: Ruff whole-repo baseline (records pre-existing findings)
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/external_gates.py --mode ruff-baseline

      - name: Mypy strict owned files
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/typing_measure.py --mode owned

      - name: Mypy strict baseline (records legacy error count)
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/typing_measure.py --mode baseline

      - name: Bandit
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/external_gates.py --mode bandit

      - name: Pip-audit locked environment
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/external_gates.py --mode pip-audit

      - name: Secret scan (non-emitting)
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/secret_scan.py

      - name: Architecture rules
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/architecture_rules.py

      - name: No-silent-failure scan
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/no_silent_failure.py

      - name: Mutation subset (6 mutants, A/B proof)
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/mutation_run.py --python "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" --max-mutants 6

      - name: Trusted-kernel branch coverage
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/coverage_gate.py --python "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe"

      - name: Focused R3 tests
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/external_gates.py --mode focused-tests

      - name: Artifact confinement and clean-checkout reproduction
        shell: powershell
        run: & "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe" -B scripts/remaster/r3/artifact_confinement.py --python "$env:TEMP\jarvis-r3-ci-venv\Scripts\python.exe"
