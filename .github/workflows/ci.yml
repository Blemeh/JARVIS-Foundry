name: ci

# The UI lane is a hard gate. The Python lane is informational until a clean
# Windows runner has been shown to match a developer machine: it publishes the
# per-file result JSON (scripts/verify.py) so regressions are attributable.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/command-center/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/verify.py --lane python --jobs 4 --timeout 240 --json out/verify.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-python
          path: out/verify.json
