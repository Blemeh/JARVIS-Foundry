---
# Canonical hybrid worker runtime activation configuration.
#
# Consumed by `jarvis -m jarvis_foundry.runtime.worker_loop --config
# config/worker_routing.yaml`. Explicit and auditable by design: the driver
# refuses to run cycles while `enabled` is false, and the owner model
# mandate (opencode_go + muse-spark-1.3-contributor, no fallbacks) is enforced at
# load time. Provider/model/api_key/base_url are owned by the machine-local
# file ``%LOCALAPPDATA%/JARVIS/config/provider.yaml`` (never committed).
schema_version: 1
status: "CONFIGURED"      # machine-local activation proven 2026-09-30
enabled: true               # owner-authorized 2026-09-30: worker execution via
                            # Supervisor-spawned loop on the existing provider path

mission_id: "mission-wfm-optimizer"
resource_id: "resource-wfm-optimizer"
capability: "write_registered_worktree_files"

provider: "opencode_go"
model: "muse-spark-1.3-contributor"

# V9 Continuous Executive: the single canonical next-work authority.
# Owner-authorized 2026-10-02 (execution-spine recovery, rel d5f92e1):
# D1/D2 repaired+promoted, D4 recovery loop-free.  All competing
# execution-capable flags stay OFF so the CE is the only mission factory.
executive:
  continuous_enabled: true
  # continuous_discovery_enabled defaults true in code; stated here so the
  # effective production configuration is explicit and auditable.
  continuous_discovery_enabled: true

# Machine-local executable coordinates (not code defaults). Missing files
# fail closed in build_worker_stack; they are never guessed from a developer
# checkout. Live spawn_worker_loop remains default OFF.

hermes:
  enabled: true
  root: "C:/Users/b/AppData/Local/hermes/foundry/worker-hermes-root"
  python_exe: "C:/Users/b/AppData/Local/hermes/hermes-agent/venv/Scripts/python.exe"
  timeout_seconds: 900
  # Explicit owner authorization for unattended contributor/training-tier use
  # in the bounded V11 A3/A4 exit proof. All other routing, budget, capability,
  # allowlist, and STOP controls remain authoritative.
  allow_data_training_tiers_noninteractive: true

openhands:
  enabled: false
  exe: ""
  timeout_seconds: 900

readiness:
  hermes:
    state: "READY"
    note: "Isolated worker root (hermes-agent cdceca4 depth-1 clone) + venv interpreter; provider round-trip READY 2026-09-30 via exact adapter CLI shape (opencode-go/muse-spark-1.3-contributor, isolated HERMES_HOME)."
    evidence: ["provider-readiness-probe:opencode-go:muse-spark-1.3-contributor:READY:2026-09-30"]
  openhands:
    state: "NOT_READY"
    note: "Install and re-prove an isolated executable before activation."
    evidence: []

role_signals:
  builder:
    bounded: true
    explicit_acceptance: true
    tests_available: true
    narrow_scope: true
    reversible: true
  repair:
    ambiguous: true
    root_cause_required: true
    recovery: true
  verifier:
    bounded: true
    explicit_acceptance: true
    tests_available: true
    narrow_scope: true

verification:
  max_repairs: 2

stop_integration:
  # Filename under Foundry home (.../hermes/foundry/EMERGENCY_STOP).
  # Do not prefix with "foundry/" — home is already the foundry directory.
  sentinel_path: "EMERGENCY_STOP"
  pause_directives: true
