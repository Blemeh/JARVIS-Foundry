schema_version: 2
status: "INACTIVE_EXAMPLE"

identity:
  system_name: "JARVIS"
  owner_name: "Blendi Mehmeti"

runtime:
  enabled: false
  start_command_received: false
  active_version: null
  trust_state: "DESIGN_ONLY"
  permission_model_after_start: "STANDING_AUTONOMY"
  owner_control_model: "VETO_AND_STOP"
  maximum_concurrent_builders_initial: 1
  executive_mode: "event_first"
  heartbeat_seconds: 300
  automatic_version_progression: true

paths:
  hermes_home: "__DISCOVER__"
  foundry_state_root: "__DISCOVER__"
  database: "__DISCOVER__"
  evidence_root: "__DISCOVER__"
  backup_root: "__DISCOVER__"
  emergency_stop_sentinel: "__DISCOVER__"

database:
  engine: "sqlite"
  journal_mode: "WAL"
  foreign_keys: true
  synchronous: "FULL"
  busy_timeout_ms: 5000

autonomy:
  default_decision_after_start: "act"
  ask_permission: false
  active_owner_vetoes: []
  active_owner_constraints: []
  capability_states:
    - "DISCOVERED"
    - "PROBING"
    - "READY"
    - "ACTIVE"
    - "DEGRADED"
    - "VETOED"
    - "STOPPED"

resources:
  automatic_discovery: true
  registry: []
  ambiguous_target_policy: "not_ready"

obsidian:
  whole_vault_search: true
  whole_vault_write_after_v2_gate: true
  v1_write_root: "JARVIS/V1"
  write_mode: "expected_hash_transaction"
  snapshot_before_write: true
  semantic_verification: true

git_and_deployment:
  autonomous_after_readiness_gate: true
  preserve_user_changes: true
  reconcile_external_state: true

external_actions:
  autonomous_after_readiness_gate: true
  communications: true
  purchases: true
  account_actions: true
  transparent_jarvis_identity: true

self_evolution:
  autonomous: true
  risk_classes:
    - "R0"
    - "R1"
    - "R2"
    - "R3"
  candidate_live_separation: true
  independent_verification: true
  automatic_rollback: true

providers:
  automatic_discovery: true
  role_config: "config/model_roles.yaml"
  credential_mode: "broker"

budgets:
  vertex_ai_gemini_initial_usd: 50
  vertex_ai_gemini_daily_soft_limit_usd: 5
  verify_billing: true
  autonomous_rerouting: true

logging:
  secret_redaction: true
  append_only_audit: true
  retention_days: "__AUTONOMOUS_POLICY__"
