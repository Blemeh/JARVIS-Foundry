schema_version: 1
status: "INACTIVE_EXAMPLE"

# DIR-2026-08-12 MANDATORY INTERNAL MODEL ROUTING: every REAL JARVIS
# internal dispatch (executive, builder, verifier, critic, repair,
# researcher, premium_reviewer, replacement workers, recovery workers,
# live canaries) must resolve to provider "opencode_go" + model
# "muse-spark-1.2-contributor" with NO fallbacks. Provider/model/base_url/
# api_key are owned by %LOCALAPPDATA%\JARVIS\config\provider.yaml. If the
# configured model is unavailable, the dispatch is recorded BLOCKED — never
# substituted with another model.
# RoleRouter.enforce_directive_routing() rejects any deviation; the
# production wiring (v3_loop.run_one_loop, live loop drivers) calls it
# before any mutation.

policy:
  availability_check_required: true
  builder_verifier_provider_diversity_preferred: false
  raw_credentials_in_context: false
  billable_calls_enabled: false

roles:
  executive:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "structured_reasoning"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "executive"

  builder:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "code"
      - "tools"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "builder"

  verifier:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "artifact_inspection"
      - "adversarial_verification"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "verifier"

  critic:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "adversarial_review"
      - "artifact_inspection"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "critic"

  repair:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "code"
      - "tools"
      - "tests"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "repair"

  researcher:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "research"
    maximum_cost_per_run_usd: 0
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "research"

  premium_reviewer:
    preferred_provider: "opencode_go"
    preferred_model: "muse-spark-1.2-contributor"
    fallbacks: []
    required_capabilities:
      - "multimodal"
    maximum_cost_per_run_usd: "__AUTONOMOUS_BUDGET_POLICY__"
    maximum_duration_seconds: "__REQUIRED__"
    independence_group: "premium"
