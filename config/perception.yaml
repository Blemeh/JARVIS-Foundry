# JARVIS Eyes (Phase 2) perception configuration.
#
# Fail-closed by default: the driver refuses to run while `enabled` is false
# (use --force only for explicit, bounded probes). Raw history stays in the
# external Screenpipe sidecar; Foundry receives only low-volume semantic
# observations. Audio remains OFF; raw frames remain PROBING.
schema_version: 1
status: "INACTIVE"
enabled: false

connector_id: "screenpipe-local"
source_version: "0.4.40"

source:
  mode: "sqlite"          # health via local API; records via guarded read-only SQLite
  api_url: "http://127.0.0.1:3030"
  data_dir: ""            # external sidecar data dir; empty = not configured
  db_path: ""             # explicit db override (data_dir/db.sqlite otherwise)
  poll_interval_seconds: 30
  max_records_per_cycle: 500
  read_timeout_seconds: 15

aggregation:
  idle_floor_seconds: 30
  min_duration_seconds: 2
  unchanged_floor_seconds: 60
  max_transitions: 8

privacy:
  excluded_apps: []
  excluded_windows: []
  sensitive_titles:
    - "password"
    - "credentials"
    - "auth"
    - "secret"
    - "private"
  private_zones: []
  secret_like_enabled: true
  raw_frame_escalation: false
  max_text_fragments: 8

audio_enabled: false
max_observations_per_cycle: 100
emit_redacted_events: true

retention:
  raw_history: "external_only"
  observation_retention_class: "bounded"
